site_name: AxonHill App Help
site_description: Simple help for the AxonHill Field and Office apps
site_url: https://gieterpot.github.io/axonhill-app-help/en/
docs_dir: docs/en
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Use dark colours
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light colours

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Choose the correct app: start-here/choose-the-correct-app.md
      - Sign in and sync: start-here/sign-in-and-sync.md
      - Change password or sign out: start-here/manage-your-account.md
      - Find and share help: start-here/find-and-share-help.md
  - Field work:
      - Record attendance: field-work/record-attendance.md
      - Submit a harvest count: field-work/submit-a-harvest-count.md
      - Submit a batch harvest count: field-work/submit-a-batch-harvest-count.md
      - Verify a harvest count: field-work/verify-a-harvest-count.md
      - Understand count statuses: field-work/understand-count-statuses.md
      - View stock and equipment: field-work/view-stock-and-equipment.md
      - Confirm incoming stock: field-work/confirm-incoming-stock.md
      - Request stock: field-work/request-stock.md
      - Issue or return stock: field-work/issue-or-return-stock.md
  - People and Harvest Groups:
      - View current members: people-harvest-groups/view-current-members.md
      - View full membership history: people-harvest-groups/view-membership-history.md
      - Change a member role: people-harvest-groups/change-a-member-role.md
      - Add an employee: people-harvest-groups/add-an-employee.md
      - Replace a chainsaw operator: people-harvest-groups/replace-a-chainsaw-operator.md
      - Share a Harvest Group summary: people-harvest-groups/share-a-harvest-group-summary.md
  - Office work:
      - Use the dashboard: office-work/use-the-dashboard.md
      - Find a worklog and view its count: office-work/find-a-worklog.md
      - Review a count needing attention: office-work/review-a-count-needing-attention.md
      - Create an attendance report: office-work/create-an-attendance-report.md
  - Fix a problem:
      - App will not open or sync: fix-a-problem/app-will-not-open-or-sync.md
      - Employee, Team or Harvest Group is missing: fix-a-problem/missing-employee-team-or-harvest-group.md
  - What changed: what-changed/index.md

extra:
  language_code: en
  language_name: English
  alternate_language_code: zu
  alternate_language_name: isiZulu

copyright: AxonHill App Help
