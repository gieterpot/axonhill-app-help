<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simple help for the AxonHill Field and Office apps">
  <title>AxonHill App Help</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { align-items: center; background: #f4f6f3; color: #17251d; display: flex; min-height: 100vh; margin: 0; }
    main { background: white; border-top: .5rem solid #176b45; border-radius: .6rem; box-shadow: 0 .5rem 2rem #17332320; margin: 1rem auto; max-width: 34rem; padding: 2rem; width: calc(100% - 4rem); }
    h1 { color: #0f4f33; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; margin: 0 0 1rem; }
    p { font-size: 1.05rem; line-height: 1.55; }
    .choices { display: grid; gap: .8rem; margin-top: 1.6rem; }
    a { background: #176b45; border-radius: .45rem; color: white; display: block; font-size: 1.1rem; font-weight: 750; padding: 1rem; text-align: center; text-decoration: none; }
    a:hover, a:focus-visible { background: #0f4f33; outline: .2rem solid #e0a800; outline-offset: .15rem; }
    small { color: #55645b; display: block; margin-top: 1.5rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #111a15; color: #e8efe9; }
      main { background: #1c2921; }
      h1 { color: #9bd7b8; }
      small { color: #bac7bd; }
    }
  </style>
</head>
<body>
  <main>
    <h1>AxonHill App Help</h1>
    <p>Choose your language.</p>
    <p>Khetha ulimi lwakho.</p>
    <div class="choices">
      <a href="./en/">English</a>
      <a href="./zu/" lang="zu">isiZulu</a>
    </div>
    <small>Free, public help for the AxonHill Field and Office apps.</small>
  </main>
</body>
</html>
