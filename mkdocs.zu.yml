site_name: Usizo Lwezinhlelo ze-AxonHill
site_description: Usizo olulula lwe-AxonHill Field ne-AxonHill Office
docs_dir: docs/zu
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: zu
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Sebenzisa imibala emnyama
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Sebenzisa imibala ekhanyayo

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Ikhaya: index.md
  - Qala lapha:
      - Khetha uhlelo olufanele: start-here/choose-the-correct-app.md
      - Ngena bese uvumelanisa: start-here/sign-in-and-sync.md
      - Shintsha i-password noma uphume: start-here/manage-your-account.md
      - Thola bese wabelana ngosizo: start-here/find-and-share-help.md
  - Umsebenzi wasehlathini:
      - Rekhoda i-attendance: field-work/record-attendance.md
      - Thumela ukubalwa komsebenzi: field-work/submit-a-harvest-count.md
      - Thumela ukubalwa kwe-batch: field-work/submit-a-batch-harvest-count.md
      - Qinisekisa ukubalwa: field-work/verify-a-harvest-count.md
      - Qonda ama-status okubalwa: field-work/understand-count-statuses.md
  - Abantu nama-Harvest Group:
      - Buka amalungu amanje: people-harvest-groups/view-current-members.md
      - Buka wonke umlando wamalungu: people-harvest-groups/view-membership-history.md
      - Shintsha umsebenzi welungu: people-harvest-groups/change-a-member-role.md
      - Faka umsebenzi eqenjini: people-harvest-groups/add-an-employee.md
      - Shintsha osebenzisa i-chainsaw: people-harvest-groups/replace-a-chainsaw-operator.md
      - Yabelana ngesifinyezo se-Harvest Group: people-harvest-groups/share-a-harvest-group-summary.md
  - Umsebenzi wasehhovisi:
      - Sebenzisa i-dashboard: office-work/use-the-dashboard.md
      - Thola i-worklog nokubalwa kwayo: office-work/find-a-worklog.md
      - Hlola ukubalwa okudinga ukunakwa: office-work/review-a-count-needing-attention.md
      - Yenza i-attendance report: office-work/create-an-attendance-report.md
  - Lungisa inkinga:
      - Uhlelo aluvuleki noma aluvumelanisi: fix-a-problem/app-will-not-open-or-sync.md
      - Umsebenzi, i-Team noma i-Harvest Group ayibonakali: fix-a-problem/missing-employee-team-or-harvest-group.md
  - Okushintshile: what-changed/index.md

extra:
  language_code: zu
  language_name: isiZulu
  alternate_language_code: en
  alternate_language_name: English

copyright: Usizo Lwezinhlelo ze-AxonHill
